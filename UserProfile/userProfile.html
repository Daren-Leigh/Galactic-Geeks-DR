<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>User Profile Page</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    </head>

    <style>


    </style>

    <body>
        <div class="container">
            <div class="profile">
                <div class="profile-header">
                    <img src="images/pngtree-user-profile-avatar-png-image_10211467.png" alt="profile" class="profile-img" />
                    <div class="profile-text-container">
                        <h1 id="profile-title">User Profile Name</h1>
                        <p id="profile-email">userprofile@gmail.com</p>
                    </div>
                </div>

                <div class="menu">
                    <a href="#" class="menu-link"><i class="fa-solid fa-circle-user menu-icon"></i>Account</a>
                    <a href="#" class="menu-link"><i class="fa-solid fa-right-from-bracket menu-icon"></i>Logout</a>
                    <a href="#" class="menu-link"><i class="fa fa-calendar menu-icon"></i>Recent Activity</a>
                    <a href="#" class="menu-link"><i class="fa-solid fa-users menu-icon"></i>Community Channel</a>
                </div>
            </div>

            <form class="account">
                <div class="account-header">
                    <h1 class="account-title">Account Settings</h1>
                    <div class="btn-container">
                        <button class="btn-cancel">Cancel</button> 
                        <button onclick="updateProfile()" class="btn-save">Save</button>
                    </div>
                </div>

                <div class="account-edit">
                    <div class="input-container">
                        <label>First Name</label>
                        <input type="text" id="name"  placeholder="First Name"/>
                    </div>
                    <div class="input-container">
                        <label>Last Name</label>
                        <input type="text" placeholder="Last Name" />
                    </div>
                </div>

                <div class="account-edit">
                    <div class="input-container">
                        <label>Email</label>
                        <input type="mail" id="email"  placeholder="Email"/>
                    </div>
                    <div class="input-container">
                        <label>Phone Number</label>
                        <input type="text" placeholder="Phone Number"/>
                    </div>
                </div>

                <div class="account-edit">
                    <div class="input-container">
                        <label>Address</label>
                        <textarea placeholder="Address"></textarea>
                    </div>
                </div>
            </form>
        </div>
        <script src="userProfile.js"></script>
        <link rel="stylesheet" href="userProfile.css">
        
    </body>
</html>
