<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/AdminStyles.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        body {
            background-color: #3f3751;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .header {
            background-color: #3f3751;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .icons {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .icons img {
            width: 40px;
            height: 40px;
        }
        .modal {
            display: none; /* Hide modal by default */
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 25px;
            border: 1px solid #888;
            border-radius: 8px;
            width: 50%;
            font-size: 18px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }
        label {
            display: block;
            margin-top: 10px;
            font-size: 16px;
        }
        input, textarea, button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        #graphiqlContainer {
            background-color: #2f2b3e;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
        }
        canvas {
            width: 100%;
            height: 300px;
        }
        .stats-container {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            color: #ffffff;
        }
        .stat-item {
            background-color: #e87722;
            padding: 20px;
            border-radius: 8px;
            width: 30%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>StudyLocker <img src="images/11910998_resized.png" alt="StudyLocker"></div>
        <div class="icons">
            <button class="navbar"> <a>Email</a> <img src="images/Screenshot (268).ico" alt="Email"></button>
            <button class="navbar"> <a href="index.html">Menu</a> <img src="images/Screenshot (267).ico" alt="Menu"></button>
            <button class="navbar"> <a>Notification</a> <img src="images/Screenshot (269).ico" alt="Notification"></button>
            <button class="navbar"> <a href="adminProfile.html">Profile</a> <img src="images/Screenshot (270).ico" alt="Profile"></button>
        </div>
    </div>

    <div class="nav-bar">
        <button onclick="sortResources()">Sort Resources</button>
        <button onclick="sortRequests()">Sort Request</button>
        <button onclick="addResource()">Add Resource</button>
        <button id="load-resources-btn" style="padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-bottom: 20px;">
        Load Resources
      </button>

      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Enter search term..." />
        <button id="searchButton">Search</button>
      </div>
      <p id="result"></p>

        <button onclick="alterResources()">Alter Resources</button>
    </div>
    <div class="container">
      <button id="historyButton">History</button>

      <!-- Pop-up Menu -->
      <div id="historyPopup" class="popup hidden">
        <div class="popup-header">
          <h2>History</h2>
        </div>
        <div class="popup-body">
          <h3>Deleted Resources</h3>
          <ul id="deletedResources"></ul>

          <h3>Saved Resources</h3>
          <ul id="savedResources"></ul>
        </div>
      </div>
    </div>
    <div>
      <!-- Button to trigger data retrieval -->
      <button id="load-resources-btn">Load Resources</button>

      <!-- Placeholder for the data -->
      <ul id="resources-list" style="list-style: none; padding: 0; font-size: 16px;"></ul>
    </div>

    <!-- Edit Resource Modal -->
    <div id="editResourceModal" class="modal">
      <div class="modal-content">
          <h2>Edit Resource</h2>
          <label for="editResourceName">Resource Name:</label>
          <input type="text" id="editResourceName">
          <label for="editRequestDate">Request Date:</label>
          <input type="text" id="editRequestDate">
          <button onclick="saveResourceChanges()">Save Changes</button>
          <button onclick="closeEditModal()">Close</button>
      </div>
    </div>

    <div class="resource-container" id="resourceContainer">
        <!-- Resources will be rendered dynamically -->
    </div>

    <!-- GraphiQL container -->
    <div id="graphiqlContainer">
        <h2>GraphiQL Interface</h2>
        <button onclick="fetchGraphData()">Fetch Data</button>
        <canvas id="resourceChart"></canvas>
    </div>

    <!-- Statistics container -->
    <div class="stats-container">
        <div class="stat-item">
            <h3>Accepted Requests</h3>
            <p id="acceptedCount">Loading...</p>
        </div>
        <div class="stat-item">
            <h3>Rejected Requests</h3>
            <p id="rejectedCount">Loading...</p>
        </div>
        <div class="stat-item">
            <h3>Resource Usage</h3>
            <p id="resourceUsageId">Loading...</p>
        </div>
    </div>

    <!-- Add Resource Modal -->
    <div id="addResourceModal" class="modal" style="padding: 20px; box-sizing: border-box;">
      <div class="modal-content" style="padding: 20px; box-sizing: border-box; max-width: 600px; margin: auto;">
        <h2 style="text-align: center; margin-bottom: 20px;">Add Resource</h2>
        <form id="addResourceForm" style="display: flex; flex-direction: column; gap: 15px;">
          <div style="display: flex; flex-direction: column;">
            <label for="resourceName" style="font-size: 16px; font-weight: bold; margin-bottom: 5px; display: block; visibility: visible; color: #000;">
              Resource Name:
            </label>
            <input type="text" id="resourceName" style="padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px;" required>
          </div>
          <div style="display: flex; flex-direction: column;">
          <label for="resourceDetails" style="font-size: 16px; font-weight: bold; margin-bottom: 5px; display: block; visibility: visible; color: #000;">
          Resource Details:
          </label>
          <textarea id="resourceDetails" rows="4" style="padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px;" required></textarea>
          </div>
          <div style="display: flex; flex-direction: column;">
          <label for="additionalDetails" style="font-size: 16px; font-weight: bold; margin-bottom: 5px; display: block; visibility: visible; color: #000;">
          Additional Resource Details:
          </label>
          <input type="text" id="additionalDetails" style="padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px;">
          </div>
          <div style="display: flex; flex-direction: column;">
          <label for="pdfUpload" style="font-size: 16px; font-weight: bold; margin-bottom: 5px; display: block; visibility: visible; color: #000;">
          Upload PDF:
          </label>
          <input type="file" id="pdfUpload" accept=".pdf" style="padding: 5px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px;">
          </div>
          <div id="pdfActions" style="display: none; margin-top: 10px; display: flex; gap: 10px;">
          <button type="button" id="viewPdfBtn" style="flex: 1; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">View PDF</button>
          <button type="button" id="deletePdfBtn" style="flex: 1; padding: 10px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">Delete PDF</button>
          </div>
          <button id="save-btn" type="submit" style="padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">Save Resource</button>
          <button onclick="closeModal()" style="padding: 10px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
          Exit
          </button>
          <span class="close" onclick="closeModal()" style="cursor: pointer; position: absolute; top: 15px; right: 10px; font-size: 24px; color: #333;">×</span>
          </form>
          </div>
          </div>
          <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
          <script>
              const SUPABASE_URL = 'https://fsjyzxygoyuxetzkpolo.supabase.co';
              const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzanl6eHlnb3l1eGV0emtwb2xvIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc0MjIwMjkyNCwiZXhwIjoyMDU3Nzc4OTI0fQ.XgpwK52aXIJNZtHUDgSfD1ThR186gNF7K_NQ0kobsuM';
              const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          
              let statsData = {
                  acceptedRequests: 0,
                  rejectedRequests: 0,
                  resourceUsageId: 0
              };
          
              function updateStats() {
                  const acceptedCountElement = document.getElementById('acceptedCount');
                  const rejectedCountElement = document.getElementById('rejectedCount');
                  const resourceUsageIdElement = document.getElementById('resourceUsageId');
          
                  if (acceptedCountElement) {
                      acceptedCountElement.textContent = statsData.acceptedRequests;
                  }
                  if (rejectedCountElement) {
                      rejectedCountElement.textContent = statsData.rejectedRequests;
                  }
                  if (resourceUsageIdElement) {
                      resourceUsageIdElement.textContent = statsData.resourceUsageId;
                  }
              }
          
              document.addEventListener('DOMContentLoaded', updateStats);
          
              const loadResourcesBtn = document.getElementById('load-resources-btn');
              const resourcesList = document.getElementById('resources-list');
          
              loadResourcesBtn.addEventListener('click', async function () {
                  const { data: resources, error } = await supabase.from('ResourceTable').select('*');
          
                  if (error) {
                      console.error("Error fetching resources:", error);
                      alert("Failed to fetch resources. Please try again later.");
                      return;
                  }
          
                  resourcesList.innerHTML = '';
                  resources.forEach(resource => {
                      const resourceItem = document.createElement('div');
                      resourceItem.style.padding = '5px 0';
                      resourceItem.style.display = 'flex';
                      resourceItem.style.alignItems = 'center';
          
                      const resourceText = document.createElement('span');
                      resourceText.textContent = resource.ResourceName;
                      resourceText.style.flexGrow = '1';
                      resourceText.style.marginRight = '10px';
                      resourceItem.appendChild(resourceText);
          
                      const viewBtn = document.createElement('button');
                      viewBtn.textContent = 'View';
                      viewBtn.style.marginRight = '5px';
                      viewBtn.style.padding = '5px';
                      viewBtn.style.backgroundColor = '#2196F3';
                      viewBtn.style.color = 'white';
                      viewBtn.style.border = 'none';
                      viewBtn.style.borderRadius = '3px';
                      viewBtn.addEventListener('click', function () {
                          alert(`Viewing ${resource.ResourceName}`);
                      });
                      resourceItem.appendChild(viewBtn);
          
                      const editBtn = document.createElement('button');
                      editBtn.textContent = 'Edit';
                      editBtn.style.marginRight = '5px';
                      editBtn.style.padding = '5px';
                      editBtn.style.backgroundColor = '#4CAF50';
                      editBtn.style.color = 'white';
                      editBtn.style.border = 'none';
                      editBtn.style.borderRadius = '3px';
                      editBtn.addEventListener('click', function () {
                          alert(`Editing ${resource.ResourceName}`);
                      });
                      resourceItem.appendChild(editBtn);
          
                      const deleteBtn = document.createElement('button');
                      deleteBtn.textContent = 'Delete';
                      deleteBtn.style.padding = '5px';
                      deleteBtn.style.backgroundColor = '#F44336';
                      deleteBtn.style.color = 'white';
                      deleteBtn.style.border = 'none';
                      deleteBtn.style.borderRadius = '3px';
                      deleteBtn.addEventListener('click', async function () {
                          const { error } = await supabase.from('ResourceTable').delete().eq('resourceid', resource.resourceid);
                          if (error) {
                              console.error("Error deleting resource:", error);
                              alert("Failed to delete resource. Please try again later.");
                          } else {
                              alert(`Deleted ${resource.ResourceName}`);
                              loadResourcesBtn.click(); // Reload resources
                          }
                      });
                      resourceItem.appendChild(deleteBtn);
          
                      resourcesList.appendChild(resourceItem);
                  });
              });
          
              document.getElementById("save-btn").addEventListener("click", async function (event) {
                  event.preventDefault();
          
                  const resourceName = document.getElementById('resourceName').value;
                  const resourceDetails = document.getElementById('resourceDetails').value;
                  const additionalDetails = document.getElementById('additionalDetails').value;
          
                  const { error } = await supabase.from('ResourceTable').insert([{
                      ResourceName: resourceName,
                      ResourceDetails: resourceDetails,
                      additionalDetails: additionalDetails
                  }]);
          
                  if (error) {
                      console.error("Error inserting resource:", error);
                      alert("Failed to save resource. Please try again later.");
                  } else {
                      alert("Resource saved successfully!");
                      closeModal();
                      loadResourcesBtn.click(); // Reload resources
                  }
              });
          
              function closeModal() {
                  document.getElementById("addResourceModal").style.display = "none";
              }
          
              function sortResources() {
                  // Implement sorting logic here
              }
          
              function addResource() {
                  document.getElementById("addResourceModal").style.display = "block";
              }
          
              function sortRequests() {
                  // Implement sorting logic here
              }
          
              function alterResources() {
                  // Implement alter resources logic here
              }
          
              function fetchGraphData() {
                  // Implement fetch graph data logic here
              }
          </script>
          </body>
          </html>
